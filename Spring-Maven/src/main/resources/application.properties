spring.application.name=MySpringBoot4Project

server.port=8080

# application-secrets.properties(gitignore 대상)를 항상 같이 로드.
# 각자 로컬에 이 파일을 만들고 jwt.secret 등 민감한 값을 채워 넣을 것
spring.profiles.include=secrets

# MariaDB
# 기본값은 localhost. WSL2 등 다른 네트워크 환경을 쓰는 팀원은
# application.properties를 고치지 말고 환경변수(DB_HOST 등)나
# application-local.properties(gitignore 대상)로 덮어쓸 것
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lab_db}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USERNAME:lab}
spring.datasource.password=${DB_PASSWORD:lab}

# 활성화 update JPA create
spring.jpa.hibernate.ddl-auto=update

# 비활성화 기존 설정 변경: update -> validate (엔티티와 실제 DB 구조가 맞는지 검증만 함)
#spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Spring Boot Admin Client
spring.boot.admin.client.url=http://localhost:8090
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500

student.name.max-length=100
student.number.max-length=20
student.phone.max-length=20
student.email.max-length=100
student.address.max-length=200

# 새로 추가되는 코드 분석 도메인 설정
analysis.language.max-length=50


# Flyway 비활성화 (스프링부트 3.x에서는 기본적으로 활성화되어 있지만 명시적으로 작성 권장)
