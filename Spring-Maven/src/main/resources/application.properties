spring.application.name=MySpringBoot4Project

server.port=8080

# MariaDB
spring.datasource.url=jdbc:mariadb://172.17.128.1:3306/lab_db
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=lab
spring.datasource.password=lab

# 활성화 update JPA
spring.jpa.hibernate.ddl-auto=update

# 비활성화 기존 설정 변경: update -> validate (엔티티와 실제 DB 구조가 맞는지 검증만 함)
#spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Spring Boot Admin Client
spring.boot.admin.client.url=http://localhost:8090
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500

student.name.max-length=100
student.number.max-length=20
student.phone.max-length=20
student.email.max-length=100
student.address.max-length=200

# 새로 추가되는 코드 분석 도메인 설정
analysis.language.max-length=50


# Flyway 비활성화 (스프링부트 3.x에서는 기본적으로 활성화되어 있지만 명시적으로 작성 권장)
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true

