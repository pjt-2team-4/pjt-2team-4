<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: commonHead('새 분석')}"></head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar(${analyses})}">
    </div>

    <div class="main-content">
        <div class="container">
            <header class="header">
                <h1>새 분석 만들기</h1>
                <p>보안 분석을 진행할 새로운 작업 공간을 생성합니다.</p>
            </header>

            <section class="section">
                <div class="card" style="max-width: 500px; margin: 0 auto; padding: 30px;">
                    <!-- 백엔드 경로 /analyses 로 수정 -->
                    <form th:action="@{/analyses}" method="post">
                        <div style="margin-bottom: 20px;">
                            <!-- 백엔드 DTO 필드명인 title과 매칭 -->
                            <label for="title" style="display:block; margin-bottom: 8px; font-weight: bold; color: #555;">분석 이름</label>
                            <input type="text" id="title" name="title" required 
                                   style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" 
                                   placeholder="예: 쇼핑몰 백엔드 V2">
                        </div>
                        <button type="submit" class="execute-button post-button">생성하기</button>
                        <a th:href="@{/analyses}" style="display:block; text-align:center; margin-top:15px; color:#7f8c8d; text-decoration:none;">취소</a>
                    </form>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
