<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commonHead('새 분석 요청 생성')}">
    <link rel="stylesheet" th:href="@{/css/upload-style.css}">
</head>
<body>

    <nav th:replace="~{fragments/sidebar :: sidebar(${analyses})}"></nav>

    <main class="main-content">
        <div class="container project-detail-container">
            
            <div class="header">
                <h1>새 분석 요청 (파일 업로드)</h1>
                <p>로컬 PC의 소스 코드 파일을 직접 업로드하여 새로운 보안 분석을 시작합니다.</p>
            </div>

            <div class="card upload-card">
                <form id="analysisUploadForm" onsubmit="return false;">
                    
                    <div class="form-group">
                        <label for="title">분석 제목 <span class="required">*</span></label>
                        <input type="text" id="title" placeholder="예: 로그인 모듈 보안 취약점 점검" maxlength="100" required>
                    </div>

                    <div class="form-group">
                        <label for="language">분석 언어 <span class="required">*</span></label>
                        <select id="language" required>
                            <option value="">언어를 선택하세요</option>
                            <option value="JAVA">Java</option>
                            <option value="PYTHON">Python</option>
                            <option value="JAVASCRIPT">JavaScript</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>소스 코드 파일 업로드 (최대 20개, 각 100KB 이하) <span class="required">*</span></label>
                        <div id="dropzone" class="dropzone">
                            <div class="dropzone-content">
                                <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                </svg>
                                <h3>파일을 이곳에 드래그하거나 클릭하여 선택하세요</h3>
                            </div>
                            <input type="file" id="fileInput" multiple webkitdirectory directory style="display: none;">
                        </div>
                    </div>

                    <div id="filePreviewContainer" class="file-preview-container" style="display: none;">
                        <div class="section-heading-row">
                            <h3 class="section-title">업로드 대기 목록</h3>
                            <span id="fileCountBadge" class="file-count-badge">0 / 20</span>
                        </div>
                        <ul id="fileList" class="file-preview-list"></ul>
                    </div>

                    <div class="form-actions" style="display: flex; gap: 10px;">
                        <a th:href="@{/analyses/list}" class="execute-button get-button" style="background-color: #6b7280; text-decoration: none;">
                            ← 취소 및 목록으로
                        </a>
                        <!-- JS로 fetch를 쏘는 버튼 -->
                        <button type="button" id="submitBtn" class="execute-button post-button">업로드 및 분석 시작하기</button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <!-- 업로드 및 백엔드 전송을 처리하는 JS (이전에 작성한 analysis-upload.js 사용) -->
    <script th:src="@{/js/analysis-upload.js}"></script>
</body>
</html>
