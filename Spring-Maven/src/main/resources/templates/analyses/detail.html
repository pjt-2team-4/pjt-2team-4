<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: commonHead('분석 상세')}"></head>
<body>

<!-- 사이드바 -->
<nav th:replace="~{fragments/sidebar :: sidebar(${analyses})}"></nav>

<main class="main-content">
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1>📂 <span th:text="${analysis.title}">분석 이름</span></h1>
            <p>분석 상세 정보와 소스코드 검사 결과를 확인합니다.</p>
        </header>

        <!-- 분석 정보 -->
        <section class="section">
            <h2 class="section-title">분석 정보</h2>
            <div class="info-grid">
                <div class="info-card">
                    <h3>분석 ID</h3>
                    <p th:text="${analysis.id}">1</p>
                </div>
                <div class="info-card">
                    <h3>분석명</h3>
                    <p th:text="${analysis.title}">쇼핑몰 백엔드</p>
                </div>
                <div class="info-card">
                    <h3>프로그래밍 언어</h3>
                    <p th:text="${analysis.language != null ? analysis.language : '미지정'}">Java</p>
                </div>
                <div class="info-card">
                    <h3>상태</h3>
                    <p th:text="${analysis.status != null ? analysis.status : '알 수 없음'}">COMPLETED</p>
                </div>
            </div>
        </section>

        <!-- 파일 트리 및 취약점 결과 통합 영역 (기존에 작성하신 레이아웃 사용) -->
        <section class="section">
            <h2 class="section-title">📁 분석 대상 파일 및 결과</h2>
            <div class="project-file-layout">
                <!-- 파일 트리 -->
                <div class="card project-file-list">
                    <h3>파일 목록</h3>
                    <div id="projectFileTree" class="project-file-tree">
                        <div class="file-tree-loading">📂 파일을 불러오는 중...</div>
                    </div>
                </div>

                <!-- 내용/취약점 출력 -->
                <div class="card project-file-content">
                    <h3>파일 내용 및 발견된 취약점</h3>
                    <pre id="fileContent" class="file-content">좌측 파일 목록에서 파일을 선택해주세요.</pre>
                </div>
            </div>
        </section>

        <!-- 관리 액션 (수정된 부분: 새 분석 요청 버튼으로 변경) -->
        <section class="section">
            <div class="card project-actions" style="display: flex; gap: 10px;">
                <a th:href="@{/analyses/list}" class="execute-button back-button" style="background-color: #6b7280; text-decoration: none;">
                    ← 전체 목록으로
                </a>
                <a th:href="@{/analyses/new}" class="execute-button post-button" style="text-decoration: none;">
                    + 새로운 분석 요청하기
                </a>
            </div>
        </section>

    </div>
</main>

<script th:inline="javascript">
    const analysisId = /*[[${analysis.id}]]*/ 0;
</script>
<script th:src="@{/js/project-detail.js}"></script>

</body>
</html>
