<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{fragments/head :: commonHead('프로젝트 관리')}">
</head>

<body>

<!-- sidebar(${projects}) -> sidebar(${analyses}) 로 수정 -->
<div th:replace="~{fragments/sidebar :: sidebar(${analyses})}"></div>

<div class="main-content">

    <div class="container">

        <!-- 헤더 -->
        <header class="header">
            <h1>📂 분석 관리</h1>
            <p>보안 분석 항목을 생성하고 관리합니다.</p>
        </header>

        <!-- 프로젝트 생성 -->
        <section class="section">
            <h2 class="section-title">➕ 새 분석</h2>

            <div class="card project-create-card">

                <form th:action="@{/analyses}" method="post">
                    <div class="input-group">
                        <label for="title">분석 이름</label>
                        <!-- name="name" -> name="title" 로 수정 -->
                        <input type="text"
                               id="title"
                               name="title"
                               required
                               placeholder="예: 쇼핑몰 백엔드 V2">
                    </div>

                    <button type="submit" class="execute-button post-button">
                        분석 생성
                    </button>
                </form>
            </div>
        </section>

        <!-- 프로젝트 목록 -->
        <section class="section">
            <h2 class="section-title">📋 분석 목록</h2>

            <div class="card">
                <table class="api-table">
                    <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="45%">분석명</th>
                        <th width="45%">관리</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- 분석 없음 (${projects} -> ${analyses}) -->
                    <tr th:if="${#lists.isEmpty(analyses)}">
                        <td colspan="3" class="empty-project">
                            생성된 분석이 없습니다.
                        </td>
                    </tr>

                    <!-- 분석 항목 반복 (${projects} -> ${analyses}, ${project} -> ${analysis}) -->
                    <tr th:each="analysis : ${analyses}">
                        <td>
                            <strong th:text="${analysis.id}">1</strong>
                        </td>

                        <td>
                            <!-- 수정 폼 -->
                            <form th:action="@{/analyses/{id}/edit(id=${analysis.id})}"
                                  method="post"
                                  class="project-edit-form">

                                <!-- name="name" -> name="title", value="${project.name}" -> value="${analysis.title}" -->
                                <input type="text"
                                       name="title"
                                       th:value="${analysis.title}"
                                       required>

                                <button type="submit" class="project-save-btn">
                                    저장
                                </button>
                            </form>
                        </td>

                        <td>
                            <!-- 상세 경로 /analyses/{id} 로 수정 -->
                            <a th:href="@{/analyses/{id}(id=${analysis.id})}"
                               class="project-detail-btn">
                                상세
                            </a>

                            <!-- 삭제 경로 /analyses/{id}/delete 로 수정 -->
                            <form th:action="@{/analyses/{id}/delete(id=${analysis.id})}"
                                  method="post"
                                  class="project-delete-form"
                                  onsubmit="return confirm('이 분석과 관련된 모든 기록이 삭제됩니다. 계속하시겠습니까?');">

                                <button type="submit" class="project-delete-btn">
                                    삭제
                                </button>
                            </form>
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </section>

    </div>

</div>

</body>
</html>
