<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="deleteCodeFileFragment" class="api-card card-delete">
        <h3 style="color: var(--theme-delete);">🗑️ 코드 파일 삭제 (DELETE)</h3>
        
        <form id="deleteCodeFileForm">
            <div class="form-group">
                <label for="deleteFileId">삭제할 파일 ID</label>
                <div class="input-group">
                    <input type="number" id="deleteFileId" class="form-control" placeholder="파일 ID 입력 (예: 1)" required>
                    <!-- 통일된 btn-delete 클래스 사용 -->
                    <button type="submit" id="deleteFileBtn" class="btn btn-delete">파일 삭제</button>
                </div>
            </div>
        </form>

        <div id="codeDeleteResultArea" class="result-area" style="display: none;">
            <div class="alert-success" id="codeDeleteSuccessMsg" style="display:none; background-color: #f8d7da; color: #721c24;"></div>
            <h4>📌 삭제 결과 (Response)</h4>
            <pre><code id="codeDeleteResultJson"></code></pre>
        </div>

        <script>
            document.getElementById('deleteCodeFileForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const fileId = document.getElementById('deleteFileId').value;
                if (!confirm(`정말로 ID ${fileId} 코드 파일을 삭제하시겠습니까?`)) return;

                const btn = document.getElementById('deleteFileBtn');
                btn.disabled = true;
                btn.textContent = '삭제 중...';

                try {
                    const result = await ApiService.delete(`${API.CODE_FILE}/${fileId}`);

                    const resultArea = document.getElementById('codeDeleteResultArea');
                    const successMsg = document.getElementById('codeDeleteSuccessMsg');
                    const resultJson = document.getElementById('codeDeleteResultJson');
                    
                    successMsg.textContent = `✅ ID ${fileId} 코드 파일이 삭제되었습니다.`;
                    successMsg.style.display = 'block';
                    resultJson.textContent = JSON.stringify(result, null, 2);
                    resultArea.style.display = 'block';

                    document.getElementById('deleteFileId').value = '';

                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '파일 삭제';
                }
            });
        </script>
    </div>
</body>
</html>
