<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="getCodeFileFragment" class="api-card card-get">
        <h3 style="color: var(--theme-get);">🔍 코드 파일 조회 (GET)</h3>
        
        <!-- 1. 프로젝트별 파일 목록 조회 -->
        <form id="getFilesByProjectForm">
            <div class="form-group">
                <label for="searchProjectId">프로젝트 ID로 파일 목록 조회</label>
                <div class="input-group">
                    <input type="number" id="searchProjectId" class="form-control" placeholder="프로젝트 ID 입력 (예: 1)" required>
                    <!-- 통일된 btn-get 클래스 사용 -->
                    <button type="submit" id="getFilesByProjectBtn" class="btn btn-get">목록 조회</button>
                </div>
            </div>
        </form>

        <!-- 2. 파일 단건 상세 조회 -->
        <form id="getFileByIdForm">
            <div class="form-group">
                <label for="searchFileId">파일 ID로 상세 조회</label>
                <div class="input-group">
                    <input type="number" id="searchFileId" class="form-control" placeholder="파일 ID 입력 (예: 1)" required>
                    <!-- 통일된 btn-get 클래스 사용 -->
                    <button type="submit" id="getFileByIdBtn" class="btn btn-get">단건 조회</button>
                </div>
            </div>
        </form>

        <!-- 결과 영역 -->
        <div id="getCodeResultArea" class="result-area" style="display: none;">
            <h4>📌 파일 조회 결과 (Response)</h4>
            <pre><code id="getCodeResultJson"></code></pre>
        </div>

        <script>
            // 1. 프로젝트별 조회 이벤트
            document.getElementById('getFilesByProjectForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const projectId = document.getElementById('searchProjectId').value;
                const btn = document.getElementById('getFilesByProjectBtn');
                
                await handleCodeFetch(`${API.CODE_FILE}/project/${projectId}`, btn, '목록 조회');
            });

            // 2. 단건 조회 이벤트
            document.getElementById('getFileByIdForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const fileId = document.getElementById('searchFileId').value;
                const btn = document.getElementById('getFileByIdBtn');
                
                await handleCodeFetch(`${API.CODE_FILE}/${fileId}`, btn, '단건 조회');
            });

            // 공통 Fetch 및 렌더링 함수
            async function handleCodeFetch(url, btnElement, originalBtnText) {
                btnElement.disabled = true;
                btnElement.textContent = '조회 중...';

                try {
                    const result = await ApiService.get(url);
                    const resultArea = document.getElementById('getCodeResultArea');
                    const resultJson = document.getElementById('getCodeResultJson');
                    
                    resultJson.textContent = JSON.stringify(result, null, 2);
                    resultArea.style.display = 'block';
                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                } finally {
                    btnElement.disabled = false;
                    btnElement.textContent = originalBtnText;
                }
            }
        </script>
    </div>
</body>
</html>
