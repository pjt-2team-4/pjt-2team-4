<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="postAnalysisForm" class="card">
        <h3>🛡️ 코드 보안 분석 요청 (POST /api/analysis)</h3>
        
        <form id="analysisForm">
            <div class="form-group" style="margin-bottom: 10px;">
                <label>프로젝트 ID</label>
                <input type="number" id="analysisProjectId" class="form-control" placeholder="예: 1" required>
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
                <label>프로그래밍 언어</label>
                <input type="text" id="analysisLanguage" class="form-control" value="java" required>
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
                <label>소스 코드</label>
                <textarea id="analysisCode" class="form-control" rows="5" placeholder="String sql = &quot;SELECT * FROM users WHERE id = &quot; + userId;" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">분석 실행</button>
        </form>

        <!-- 분석 결과 출력 영역 -->
        <div id="analysisResultArea" style="margin-top: 20px; display: none;">
            <h4>📌 분석 결과 대시보드</h4>
            <div style="background: #f8f9fa; padding: 10px; border-radius: 4px; margin-bottom: 10px;">
                <p><strong>상태:</strong> <span id="resStatus"></span></p>
                <p><strong>총 취약점 개수:</strong> <span id="resTotalCount"></span>개 (High: <span id="resHighCount" style="color: red;"></span>)</p>
            </div>
            <h5>취약점 상세 내역</h5>
            <pre><code id="analysisResultJson"></code></pre>
        </div>

        <script>
            document.getElementById('analysisForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const data = {
                    projectId: Number(document.getElementById('analysisProjectId').value),
                    language: document.getElementById('analysisLanguage').value,
                    code: document.getElementById('analysisCode').value
                };

                try {
                    const response = await fetch('/api/analysis', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) {
                        throw new Error('분석 요청 실패 (상태 코드: ' + response.status + ')');
                    }

                    const result = await response.json();

                    // 화면에 결과 바인딩
                    document.getElementById('resStatus').textContent = result.status;
                    document.getElementById('resTotalCount').textContent = result.totalCount;
                    document.getElementById('resHighCount').textContent = result.highCount;
                    document.getElementById('analysisResultJson').textContent = JSON.stringify(result, null, 2);
                    document.getElementById('analysisResultArea').style.display = 'block';

                    alert('코드 분석이 완료되었습니다!');

                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                }
            });
        </script>
    </div>
</body>
</html>
