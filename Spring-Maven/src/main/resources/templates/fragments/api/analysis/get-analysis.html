<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="getAnalysisFragment" class="card">
        <h3>🔍 분석 결과 단건 조회 (GET /api/analysis/{id})</h3>
        
        <div class="form-group" style="margin-bottom: 15px;">
            <label>분석 요청 ID</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="number" id="getAnalysisId" class="form-control" placeholder="ID 입력 (예: 1)">
                <button type="button" id="getAnalysisBtn" class="btn btn-secondary" style="padding: 6px 12px; border-radius: 4px; cursor: pointer;">결과 조회</button>
            </div>
        </div>

        <div id="getAnalysisResultArea" style="margin-top: 15px; display: none;">
            <h4>📌 조회된 분석 결과</h4>
            <pre><code id="getAnalysisResultJson"></code></pre>
        </div>

        <script>
            document.getElementById('getAnalysisBtn').addEventListener('click', async function() {
                const id = document.getElementById('getAnalysisId').value;
                if (!id) {
                    alert('조회할 분석 ID를 입력해주세요.');
                    return;
                }

                try {
                    const response = await fetch(`/api/analysis/${id}`);
                    if (!response.ok) {
                        throw new Error('분석 결과를 찾을 수 없습니다. (상태 코드: ' + response.status + ')');
                    }

                    const result = await response.json();

                    const resultArea = document.getElementById('getAnalysisResultArea');
                    const resultJson = document.getElementById('getAnalysisResultJson');
                    
                    resultJson.textContent = JSON.stringify(result, null, 2);
                    resultArea.style.display = 'block';

                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                }
            });
        </script>
    </div>
</body>
</html>
