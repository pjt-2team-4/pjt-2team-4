<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="deleteSection" class="api-section">
        <div class="section-header">
            <span class="method delete">DELETE</span>
            <h2 style="color: var(--theme-delete);">회원 삭제</h2>
        </div>
        
        <div class="api-card card-delete">
            <div class="api-title">
                <span class="method delete">DELETE</span>
                <code>${API.USER}/{id}</code>
            </div>
            
            <form id="deleteUserForm">
                <div class="form-group">
                    <label>삭제할 회원 ID</label>
                    <div class="flex-group">
                        <input type="number" id="deleteUserId" class="form-control" placeholder="ID 입력" required>
                        <button type="submit" class="btn btn-delete">회원 삭제</button>
                    </div>
                </div>
            </form>

            <div id="deleteUserResultArea" class="result-area">
                <div class="alert-success" id="deleteSuccessMsg" style="display:none; background-color: #f8d7da; color: #721c24;"></div>
                <strong>📌 삭제 결과 (Response)</strong>
                <pre><code id="deleteUserResultJson"></code></pre>
            </div>
        </div>

        <script>
            document.getElementById('deleteUserForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const id = document.getElementById('deleteUserId').value;
                
                if (!confirm(`정말로 ID ${id} 회원을 삭제하시겠습니까?`)) return;
                
                const btn = this.querySelector('button');
                btn.disabled = true;
                btn.textContent = '삭제 중...';

                try {
                    const result = await ApiService.delete(`${API.USER}/${id}`);
                    document.getElementById('deleteUserResultJson').textContent = JSON.stringify(result, null, 2);
                    document.getElementById('deleteSuccessMsg').textContent = `✅ ID ${id} 회원 계정이 삭제되었습니다.`;
                    document.getElementById('deleteSuccessMsg').style.display = 'block';
                    document.getElementById('deleteUserResultArea').style.display = 'block';
                    document.getElementById('deleteUserId').value = '';
                } catch (error) {
                    alert('오류 발생: ' + error.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '회원 삭제';
                }
            });
        </script>
    </section>
</body>
</html>
