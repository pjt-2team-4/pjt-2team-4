<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="postSection" class="api-section">
        <div class="section-header">
            <span class="method post">POST</span>
            <h2 style="color: var(--theme-post);">회원 생성 (회원가입)</h2>
        </div>
        
        <div class="api-card card-post">
            <div class="api-title">
                <span class="method post">POST</span>
                <code>/api/user</code>
            </div>
            <h3>새로운 회원 등록</h3>
            
            <form id="createUserForm">
                <div class="form-group">
                    <label>이메일 (Email)</label>
                    <input type="email" id="postUserEmail" class="form-control" placeholder="user@example.com" required>
                </div>
                <div class="form-group">
                    <label>비밀번호 (Password)</label>
                    <input type="password" id="postUserPassword" class="form-control" placeholder="비밀번호 입력" required>
                </div>
                <button type="submit" class="btn btn-post">회원 등록</button>
            </form>

            <div id="postResultArea" class="result-area">
                <div class="alert-success" id="postSuccessMsg" style="display:none; background-color: #d4edda; color: #155724;"></div>
                <strong>📌 등록 결과 (Response)</strong>
                <pre><code id="postResultJson"></code></pre>
            </div>
        </div>

        <script>
            document.getElementById('createUserForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const btn = this.querySelector('button');
                btn.disabled = true;
                btn.textContent = '등록 중...';

                const data = {
                    email: document.getElementById('postUserEmail').value,
                    password: document.getElementById('postUserPassword').value
                };

                try {
                    const result = await ApiService.post(API.USER, data);
                    document.getElementById('postResultJson').textContent = JSON.stringify(result, null, 2);
                    document.getElementById('postSuccessMsg').textContent = `✅ 가입 성공! (ID: ${result.id})`;
                    document.getElementById('postSuccessMsg').style.display = 'block';
                    document.getElementById('postResultArea').style.display = 'block';
                } catch (error) {
                    alert('오류 발생: ' + error.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '회원 등록';
                }
            });
        </script>
    </section>
</body>
</html>
