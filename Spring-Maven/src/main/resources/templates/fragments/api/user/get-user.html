<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="getSection" class="api-section">
        <div class="section-header">
            <span class="method get">GET</span>
            <h2>회원 조회</h2>
        </div>
        
        <div class="api-card" style="margin-bottom: 20px;">
            <h3>1. 전체 회원 목록 조회</h3>
            <p>등록된 모든 회원 목록을 가져옵니다. <code>(GET /api/user)</code></p>
            <button type="button" id="getAllUsersBtn" class="btn btn-info" style="background-color: #17a2b8; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 5px;">전체 목록 가져오기</button>
        </div>

        <div class="api-card" style="margin-bottom: 20px;">
            <h3>2. ID로 회원 단건 조회</h3>
            <p>특정 ID를 가진 회원의 정보를 조회합니다. <code>(GET /api/user/{id})</code></p>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="number" id="searchUserId" class="form-control" placeholder="ID 입력 (예: 1)" style="padding: 6px; flex: 1;">
                <button type="button" id="getUserByIdBtn" class="btn btn-secondary" style="background-color: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">ID 조회</button>
            </div>
        </div>

        <div class="api-card" style="margin-bottom: 20px;">
            <h3>3. 이메일로 회원 조회</h3>
            <p>특정 이메일을 가진 회원의 정보를 조회합니다. <code>(GET /api/user/email/{email})</code></p>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="email" id="searchUserEmail" class="form-control" placeholder="이메일 입력 (예: test@example.com)" style="padding: 6px; flex: 1;">
                <button type="button" id="getUserByEmailBtn" class="btn btn-secondary" style="background-color: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">이메일 조회</button>
            </div>
        </div>

        <!-- 결과 출력 영역 -->
        <div id="getUserResultArea" style="margin-top: 20px; display: none;">
            <strong>📌 조회 결과 (Response)</strong>
            <pre style="background: #f8f9fa; padding: 10px; border-radius: 4px; margin-top: 5px;"><code id="getUserResultJson"></code></pre>
        </div>

        <!-- 실제 작동을 위한 JavaScript Fetch 연동 -->
        <script>
            // 1. 전체 유저 목록 조회
            document.getElementById('getAllUsersBtn').addEventListener('click', async function() {
                try {
                    const response = await fetch('/api/user');
                    if (!response.ok) throw new Error('전체 목록을 불러오지 못했습니다.');
                    const result = await response.json();
                    renderResult(result);
                } catch (error) {
                    alert('오류 발생: ' + error.message);
                }
            });

            // 2. ID로 유저 단건 조회
            document.getElementById('getUserByIdBtn').addEventListener('click', async function() {
                const id = document.getElementById('searchUserId').value;
                if (!id) {
                    alert('조회할 ID를 입력해주세요.');
                    return;
                }
                try {
                    const response = await fetch(`/api/user/${id}`);
                    if (!response.ok) throw new Error('해당 ID의 회원을 찾을 수 없습니다.');
                    const result = await response.json();
                    renderResult(result);
                } catch (error) {
                    alert('오류 발생: ' + error.message);
                }
            });

            // 3. 이메일로 유저 조회
            document.getElementById('getUserByEmailBtn').addEventListener('click', async function() {
                const email = document.getElementById('searchUserEmail').value;
                if (!email) {
                    alert('조회할 이메일을 입력해주세요.');
                    return;
                }
                try {
                    const response = await fetch(`/api/user/email/${email}`);
                    if (!response.ok) throw new Error('해당 이메일의 회원을 찾을 수 없습니다.');
                    const result = await response.json();
                    renderResult(result);
                } catch (error) {
                    alert('오류 발생: ' + error.message);
                }
            });

            // 공통 결과 렌더링 함수
            function renderResult(data) {
                const resultArea = document.getElementById('getUserResultArea');
                const resultJson = document.getElementById('getUserResultJson');
                
                resultJson.textContent = JSON.stringify(data, null, 2);
                resultArea.style.display = 'block';
            }
        </script>
    </section>
</body>
</html>
