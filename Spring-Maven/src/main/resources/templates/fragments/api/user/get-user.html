<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="getSection" class="api-section">
        <div class="section-header">
            <span class="method get">GET</span>
            <h2>회원 조회</h2>
        </div>
        
        <div class="api-card">
            <h3>1. 전체 회원 목록 조회</h3>
            <p>등록된 모든 회원 목록을 가져옵니다. <code>(GET /api/user)</code></p>
            <button type="button" id="getAllUsersBtn" class="btn btn-info">전체 목록 가져오기</button>
        </div>

        <div class="api-card">
            <h3>2. ID로 회원 단건 조회</h3>
            <p>특정 ID를 가진 회원의 정보를 조회합니다. <code>(GET /api/user/{id})</code></p>
            <div class="form-group flex-group">
                <input type="number" id="searchUserId" class="form-control" placeholder="ID 입력 (예: 1)">
                <button type="button" id="getUserByIdBtn" class="btn btn-secondary">ID 조회</button>
            </div>
        </div>

        <div class="api-card">
            <h3>3. 이메일로 회원 조회</h3>
            <p>특정 이메일을 가진 회원의 정보를 조회합니다. <code>(GET /api/user/email/{email})</code></p>
            <div class="form-group flex-group">
                <input type="email" id="searchUserEmail" class="form-control" placeholder="이메일 입력 (예: test@example.com)">
                <button type="button" id="getUserByEmailBtn" class="btn btn-secondary">이메일 조회</button>
            </div>
        </div>

        <div id="getUserResultArea" class="result-area">
            <strong>📌 조회 결과 (Response)</strong>
            <pre><code id="getUserResultJson"></code></pre>
        </div>

        <script>
            // (JS 로직 기존과 동일)
            document.getElementById('getAllUsersBtn').addEventListener('click', async function() {
                try {
                    const response = await fetch('/api/user');
                    if (!response.ok) throw new Error('전체 목록을 불러오지 못했습니다.');
                    const result = await response.json();
                    renderResult(result);
                } catch (error) { alert('오류 발생: ' + error.message); }
            });

            document.getElementById('getUserByIdBtn').addEventListener('click', async function() {
                const id = document.getElementById('searchUserId').value;
                if (!id) { alert('조회할 ID를 입력해주세요.'); return; }
                try {
                    const response = await fetch(`/api/user/${id}`);
                    if (!response.ok) throw new Error('해당 ID의 회원을 찾을 수 없습니다.');
                    const result = await response.json();
                    renderResult(result);
                } catch (error) { alert('오류 발생: ' + error.message); }
            });

            document.getElementById('getUserByEmailBtn').addEventListener('click', async function() {
                const email = document.getElementById('searchUserEmail').value;
                if (!email) { alert('조회할 이메일을 입력해주세요.'); return; }
                try {
                    const response = await fetch(`/api/user/email/${email}`);
                    if (!response.ok) throw new Error('해당 이메일의 회원을 찾을 수 없습니다.');
                    const result = await response.json();
                    renderResult(result);
                } catch (error) { alert('오류 발생: ' + error.message); }
            });

            function renderResult(data) {
                const resultArea = document.getElementById('getUserResultArea');
                const resultJson = document.getElementById('getUserResultJson');
                resultJson.textContent = JSON.stringify(data, null, 2);
                resultArea.style.display = 'block';
            }
        </script>
    </section>
</body>
</html>
