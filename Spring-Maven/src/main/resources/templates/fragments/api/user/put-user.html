<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="putSection" class="api-section">
        <div class="section-header">
            <span class="method put">PUT</span>
            <h2>회원 수정</h2>
        </div>
        
        <div class="api-card">
            <div class="api-title">
                <span class="method put">PUT</span>
                <code>/api/user/{id}</code>
            </div>
            <h3>회원 정보 수정</h3>
            <p>기존 회원의 이메일 및 비밀번호 정보를 수정합니다.</p>
            
            <form id="updateUserForm">
                <div class="form-group">
                    <label>수정할 회원 ID (Path Variable)</label>
                    <input type="number" id="updateUserId" class="form-control" placeholder="ID 입력 (예: 1)" required>
                </div>
                <div class="form-group">
                    <label>변경할 이메일</label>
                    <input type="email" id="updateUserEmail" class="form-control" placeholder="updated@example.com" required>
                </div>
                <div class="form-group">
                    <label>변경할 비밀번호</label>
                    <input type="password" id="updateUserPassword" class="form-control" placeholder="newPassword456!" required>
                </div>
                <button type="submit" class="btn btn-warning">회원 정보 수정</button>
            </form>

            <div id="updateResultArea" class="result-area">
                <strong>📌 수정 결과 (Response)</strong>
                <pre><code id="updateResultJson"></code></pre>
            </div>
        </div>

        <script>
            document.getElementById('updateUserForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const id = document.getElementById('updateUserId').value;
                const data = {
                    email: document.getElementById('updateUserEmail').value,
                    password: document.getElementById('updateUserPassword').value
                };
                try {
                    const response = await fetch(`/api/user/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || '회원 수정 실패 (상태 코드: ' + response.status + ')');
                    }
                    const result = await response.json();
                    
                    const resultArea = document.getElementById('updateResultArea');
                    const resultJson = document.getElementById('updateResultJson');
                    
                    resultJson.textContent = JSON.stringify(result, null, 2);
                    resultArea.style.display = 'block';
                    alert(`ID ${id} 회원 정보가 성공적으로 수정되었습니다!`);
                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                }
            });
        </script>
    </section>
</body>
</html>
