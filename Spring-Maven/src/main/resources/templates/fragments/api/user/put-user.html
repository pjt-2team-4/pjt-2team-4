<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="putSection" class="api-section">
        <div class="section-header">
            <span class="method put">PUT</span>
            <h2 style="color: var(--theme-put);">회원 수정</h2>
        </div>
        
        <div class="api-card card-put">
            <div class="api-title">
                <span class="method put">PUT</span>
                <code>/api/user/{id}</code>
            </div>
            <h3>회원 정보 수정</h3>
            
            <form id="updateUserForm">
                <div class="form-group">
                    <label>수정할 회원 ID</label>
                    <input type="number" id="updateUserId" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>변경할 이메일</label>
                    <input type="email" id="updateUserEmail" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>변경할 비밀번호</label>
                    <input type="password" id="updateUserPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-put">정보 수정</button>
            </form>

            <div id="updateResultArea" class="result-area">
                <div class="alert-success" id="updateSuccessMsg" style="display:none; background-color: #fff3cd; color: #856404;"></div>
                <strong>📌 수정 결과 (Response)</strong>
                <pre><code id="updateResultJson"></code></pre>
            </div>
        </div>

        <script>
            document.getElementById('updateUserForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const btn = this.querySelector('button');
                const id = document.getElementById('updateUserId').value;
                btn.disabled = true;
                btn.textContent = '수정 중...';

                const data = {
                    email: document.getElementById('updateUserEmail').value,
                    password: document.getElementById('updateUserPassword').value
                };

                try {
                    const result = await ApiService.put(`${API.USER}/${id}`, data);
                    document.getElementById('updateResultJson').textContent = JSON.stringify(result, null, 2);
                    document.getElementById('updateSuccessMsg').textContent = `✅ 회원 정보가 성공적으로 수정되었습니다.`;
                    document.getElementById('updateSuccessMsg').style.display = 'block';
                    document.getElementById('updateResultArea').style.display = 'block';
                } catch (error) {
                    alert('오류 발생: ' + error.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '정보 수정';
                }
            });
        </script>
    </section>
</body>
</html>
