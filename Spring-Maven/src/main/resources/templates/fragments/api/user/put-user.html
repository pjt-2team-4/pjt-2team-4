<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="putSection" class="api-section">
        <div class="section-header">
            <span class="method put">PUT</span>
            <h2>회원 수정</h2>
        </div>
        
        <div class="api-card">
            <div class="api-title">
                <span class="method put">PUT</span>
                <code>/api/user/{id}</code>
            </div>
            <h3>회원 정보 수정</h3>
            <p>기존 회원의 이메일 및 비밀번호 정보를 수정합니다.</p>
            
            <!-- 실제 입력을 받고 API를 호출하는 폼 -->
            <form id="updateUserForm" style="margin-top: 15px;">
                <div class="form-group" style="margin-bottom: 10px;">
                    <label><strong>수정할 회원 ID (Path Variable)</strong></label>
                    <input type="number" id="updateUserId" class="form-control" placeholder="ID 입력 (예: 1)" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label><strong>변경할 이메일</strong></label>
                    <input type="email" id="updateUserEmail" class="form-control" placeholder="updated@example.com" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label><strong>변경할 비밀번호</strong></label>
                    <input type="password" id="updateUserPassword" class="form-control" placeholder="newPassword456!" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <button type="submit" class="btn btn-warning" style="background-color: #f0ad4e; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">회원 정보 수정</button>
            </form>

            <!-- 결과 출력 영역 -->
            <div id="updateResultArea" style="margin-top: 20px; display: none;">
                <strong>📌 수정 결과 (Response)</strong>
                <pre style="background: #f8f9fa; padding: 10px; border-radius: 4px; margin-top: 5px;"><code id="updateResultJson"></code></pre>
            </div>
        </div>

        <!-- 실제 작동을 위한 JavaScript Fetch 연동 -->
        <script>
            document.getElementById('updateUserForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const id = document.getElementById('updateUserId').value;
                const data = {
                    email: document.getElementById('updateUserEmail').value,
                    password: document.getElementById('updateUserPassword').value
                };

                try {
                    const response = await fetch(`/api/user/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || '회원 수정 실패 (상태 코드: ' + response.status + ')');
                    }

                    const result = await response.json();

                    // 화면에 결과 출력
                    const resultArea = document.getElementById('updateResultArea');
                    const resultJson = document.getElementById('updateResultJson');
                    
                    resultJson.textContent = JSON.stringify(result, null, 2);
                    resultArea.style.display = 'block';

                    alert(`ID ${id} 회원 정보가 성공적으로 수정되었습니다!`);

                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                }
            });
        </script>
    </section>
</body>
</html>
