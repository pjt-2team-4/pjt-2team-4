<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- 공통 head 조각 불러오기 -->
<head th:replace="~{fragments/head :: commonHead('코드 파일 관리 대시보드')}"></head>

<body>

    <!-- 전역 상단 네비게이션 바 -->
    <nav class="top-navbar">
        <div class="nav-left">
            <h2>🏫 Spring Boot 관리자</h2>
        </div>
        <div class="nav-right">
            <a th:href="@{/}" class="nav-link">홈</a>
            <a th:href="@{/api-guide}" class="nav-link">API 가이드</a>
            <a th:href="@{/analysis-management}" class="nav-link">코드 보안 분석</a>
            <a th:href="@{/code-file-management}" class="nav-link active">코드 파일 관리</a>
        </div>
    </nav>

    <div class="container" style="max-width: 1200px; margin: 30px auto; padding: 20px;">
        <header class="header" style="margin-bottom: 30px; text-align: center;">
            <h1>📄 코드 파일 관리 대시보드</h1>
            <p>프로젝트별 소스 코드 파일을 등록, 조회, 삭제하며 관리할 수 있습니다.</p>
        </header>

        <!-- 코드 파일 전용 레이아웃 (좌측: 생성, 우측: 조회 및 삭제) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- 왼쪽: 파일 생성 조각 -->
            <div>
                <div th:replace="~{fragments/api/code-file/post-code-file :: postCodeFileForm}"></div>
            </div>
            
            <!-- 오른쪽: 파일 조회 및 삭제 조각 -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div th:replace="~{fragments/api/code-file/get-code-file :: getCodeFileFragment}"></div>
                <div th:replace="~{fragments/api/code-file/delete-code-file :: deleteCodeFileFragment}"></div>
            </div>
        </div>
    </div>

</body>
</html>
