<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- 공통 head 조각 불러오기 -->
<head th:replace="~{fragments/head :: commonHead('프로젝트 통합 관리 대시보드')}"></head>

<body>

<!-- 전역 상단 네비게이션 바 -->
    <nav class="top-navbar">
        <div class="nav-left">
            <h2>🏫 Spring Boot 관리자</h2>
        </div>
        <div class="nav-right">
            <a th:href="@{/}" class="nav-link">홈</a>
            <a th:href="@{/api-guide}" class="nav-link">API 가이드</a>
            <a th:href="@{/user-management}" class="nav-link">유저 관리</a>
            <a th:href="@{/project-management}" class="nav-link active">프로젝트 관리</a>
            <a th:href="@{/code-file-management}" class="nav-link">코드 파일 관리</a>
            <a th:href="@{/analysis-management}" class="nav-link">코드 보안 분석</a>
        </div>
    </nav>

    <!-- 반응형 대시보드 컨테이너 적용 -->
    <div class="container dashboard-container">
        <header class="header text-center">
            <h1>⚙️ 프로젝트 API 통합 관리 대시보드</h1>
            <p>보안 분석의 기준이 되는 최상위 프로젝트를 생성하고 목록을 관리합니다.</p>
        </header>

        <!-- 반응형 2분할 그리드 레이아웃 적용 -->
        <div class="grid-layout">
            <!-- 왼쪽: 프로젝트 등록 조각 -->
            <div class="grid-item">
                <div th:replace="~{fragments/api/project/post-project :: postProjectForm}"></div>
            </div>
            
            <!-- 오른쪽: 프로젝트 조회 및 삭제 조각 (세로 누적 배치) -->
            <div class="grid-item" style="display: flex; flex-direction: column; gap: 20px;">
                <div th:replace="~{fragments/api/project/get-project :: getProjectFragment}"></div>
                <div th:replace="~{fragments/api/project/delete-project :: deleteProjectFragment}"></div>
            </div>
        </div>
    </div>

</body>
</html>
