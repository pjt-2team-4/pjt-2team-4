<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="getProjectFragment" class="api-card card-get">
        <h3 style="color: var(--theme-get);">🔍 프로젝트 조회 (GET)</h3>

        <!-- 1. 단건 조회 폼 -->
        <form id="getProjectByIdForm">
            <div class="form-group">
                <label for="searchId">프로젝트 ID로 단건 조회</label>
                <div class="api-title">
                <code>${API.PROJECT}/{id}</code>
                </div>
                <div class="input-group">
                    <input type="number" id="searchId" class="form-control" placeholder="ID 입력 (예: 1)" required>
                    <!-- 통일된 btn-get 클래스 -->
                    <button type="submit" id="searchBtn" class="btn btn-get">단건 조회</button>
                </div>
            </div>
        </form>

        <!-- 2. 전체 조회 버튼 -->
        <div class="form-group" style="margin-top: 20px;">
            <label>전체 프로젝트 목록 조회</label>
            <code>${API.PROJECT}</code>

            <div>
                <!-- 통일된 btn-get 클래스 -->
                <button type="button" id="getAllBtn" class="btn btn-get" style="width: 100%;">전체 목록 가져오기</button>
            </div>
        </div>

        <!-- 결과 출력 영역 -->
        <div id="getResultArea" class="result-area" style="display: none;">
            <h4>📌 조회 결과 (Response)</h4>
            <pre><code id="getResultJson"></code></pre>
        </div>

        <script>
            // 1. 단건 조회
            document.getElementById('getProjectByIdForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const id = document.getElementById('searchId').value;
                const btn = document.getElementById('searchBtn');
                await handleProjectFetch(`${API.PROJECT}/${id}`, btn, '단건 조회');
            });

            // 2. 전체 목록 조회
            document.getElementById('getAllBtn').addEventListener('click', async function() {
                const btn = document.getElementById('getAllBtn');
                await handleProjectFetch(API.PROJECT, btn, '전체 목록 가져오기');
            });

            // 공통 Fetch 및 렌더링 함수
            async function handleProjectFetch(url, btnElement, originalBtnText) {
                btnElement.disabled = true;
                btnElement.textContent = '조회 중...';

                try {
                    const result = await ApiService.get(url);
                    const resultArea = document.getElementById('getResultArea');
                    const resultJson = document.getElementById('getResultJson');
                    
                    resultJson.textContent = JSON.stringify(result, null, 2);
                    resultArea.style.display = 'block';

                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                } finally {
                    btnElement.disabled = false;
                    btnElement.textContent = originalBtnText;
                }
            }
        </script>
    </div>
</body>
</html>
