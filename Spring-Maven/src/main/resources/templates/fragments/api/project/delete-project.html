<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="deleteProjectFragment" class="api-card card-delete">
        <h3 style="color: var(--theme-delete);">🗑️ 프로젝트 삭제 (DELETE)</h3>
        
        <form id="deleteProjectForm">
            <div class="form-group">
                <label for="deleteId">삭제할 프로젝트 ID</label>
                <div class="input-group">
                    <input type="number" id="deleteId" class="form-control" placeholder="ID 입력 (예: 1)" required>
                    <!-- 통일된 btn-delete 클래스 -->
                    <button type="submit" id="deleteBtn" class="btn btn-delete">삭제하기</button>
                </div>
            </div>
        </form>

        <div id="deleteResultArea" class="result-area" style="display: none;">
            <div class="alert-success" id="deleteSuccessMsg" style="display:none; background-color: #f8d7da; color: #721c24;"></div>
            <h4>📌 삭제 결과 (Response)</h4>
            <pre><code id="deleteResultJson"></code></pre>
        </div>

        <script>
            document.getElementById('deleteProjectForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const id = document.getElementById('deleteId').value;
                if (!confirm(`정말로 ID ${id} 프로젝트를 삭제하시겠습니까?`)) return;

                const btn = document.getElementById('deleteBtn');
                btn.disabled = true;
                btn.textContent = '삭제 중...';

                try {
                    const result = await ApiService.delete(`${API.PROJECT}/${id}`);

                    const deleteResultArea = document.getElementById('deleteResultArea');
                    const deleteSuccessMsg = document.getElementById('deleteSuccessMsg');
                    const deleteResultJson = document.getElementById('deleteResultJson');
                    
                    deleteSuccessMsg.textContent = `✅ ID ${id} 프로젝트가 성공적으로 삭제되었습니다.`;
                    deleteSuccessMsg.style.display = 'block';
                    deleteResultJson.textContent = JSON.stringify(result, null, 2);
                    deleteResultArea.style.display = 'block';

                    document.getElementById('deleteId').value = '';

                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = '삭제하기';
                }
            });
        </script>
    </div>
</body>
</html>
