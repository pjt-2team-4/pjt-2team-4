<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="deleteProjectFragment" class="card">
        <h3>🗑️ 프로젝트 삭제 (DELETE /api/project/{id})</h3>
        
        <!-- 삭제 입력 폼 -->
        <div class="form-group" style="margin-bottom: 15px;">
            <label>삭제할 프로젝트 ID</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="number" id="deleteId" class="form-control" placeholder="ID 입력 (예: 1)">
                <button type="button" id="deleteBtn" class="btn btn-danger" style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">삭제하기</button>
            </div>
        </div>

        <!-- 결과 메시지 출력 영역 -->
        <div id="deleteResultArea" style="margin-top: 15px; display: none;">
            <h4>📌 삭제 결과 (Response)</h4>
            <pre><code id="deleteResultJson"></code></pre>
        </div>

        <!-- 실제 작동을 위한 JavaScript 추가 -->
        <script>
            document.getElementById('deleteBtn').addEventListener('click', async function() {
                const id = document.getElementById('deleteId').value;
                if (!id) {
                    alert('삭제할 프로젝트 ID를 입력해주세요.');
                    return;
                }

                // 사용자 확인 팝업
                if (!confirm(`정말로 ID ${id} 프로젝트를 삭제하시겠습니까?`)) {
                    return;
                }

                try {
                    // DELETE 요청 전송
                    const response = await fetch(`/api/project/${id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) {
                        throw new Error('삭제 실패 (상태 코드: ' + response.status + ')');
                    }

                    // 200 OK 이며 바디가 없는 경우 처리
                    const deleteResultArea = document.getElementById('deleteResultArea');
                    const deleteResultJson = document.getElementById('deleteResultJson');
                    
                    deleteResultJson.textContent = `ID ${id} 프로젝트가 성공적으로 삭제되었습니다. (Status: 200 OK)`;
                    deleteResultArea.style.display = 'block';

                    alert(`ID ${id} 프로젝트가 삭제되었습니다.`);
                    
                    // 입력창 초기화
                    document.getElementById('deleteId').value = '';

                } catch (error) {
                    console.error('Error:', error);
                    alert('오류 발생: ' + error.message);
                }
            });
        </script>
    </div>
</body>
</html>
