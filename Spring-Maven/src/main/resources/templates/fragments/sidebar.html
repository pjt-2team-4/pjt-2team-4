<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<body>

<nav th:fragment="sidebar(analyses)" class="left-sidebar">

    <!-- 사이드바 헤더 -->
    <div class="sidebar-header">
        <h2>🏫 Code Guard</h2>
    </div>

    <!-- 사이드바 메뉴 -->
    <div class="sidebar-menu">

        <!-- 기본 메뉴 -->
        <a th:href="@{/}"
           class="nav-link active">
            홈 (대시보드)
        </a>

        <a th:href="@{/analyses}"
           class="nav-link">
            코드 보안 분석
        </a>

        <!-- 새 분석 요청 생성 (단수 -> 복수 analyses/new 로 통일) -->
        <a th:href="@{/analyses/new}"
           class="execute-button post-button"
           style="text-decoration: none; width: auto;">
            + 새 분석 요청
        </a>

        <!-- 구분선 -->
        <hr class="sidebar-divider">

        <!-- 분석 섹션 -->
        <div class="sidebar-section-header">
            <span>내 분석 목록</span>
            <a th:href="@{/analyses/new}"
               class="add-btn"
               title="새 분석 생성">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </a>
        </div>

        <!-- 분석 목록 -->
        <div class="project-menu">

            <!-- 전체 분석 관리 -->
            <a th:href="@{/analyses/list}"
               class="nav-link sub-link">
                📂 전체 분석 관리
            </a>

            <!-- 등록된 분석 항목 (단수 -> 복수 analyses/{id} 로 통일) -->
            <a th:each="analysis : ${analyses}"
               th:href="@{/analyses/{id}(id=${analysis.id})}"
               class="nav-link sub-link project-item">
                <span class="project-dot"></span>
                <span th:text="${analysis.title}">
                    분석 타이틀
                </span>
            </a>

            <!-- 분석 데이터가 없는 경우 -->
            <div th:if="${#lists.isEmpty(analyses)}"
                 class="project-empty">
                등록된 분석이 없습니다.
            </div>

        </div>

        <!-- 기타 메뉴 -->
        <a th:href="@{/user/list-users}"
           class="nav-link">
            회원 전체 조회
        </a>

        <a th:href="@{/api-guide}"
           class="nav-link">
            API 가이드
        </a>

    </div>

</nav>

</body>
</html>
