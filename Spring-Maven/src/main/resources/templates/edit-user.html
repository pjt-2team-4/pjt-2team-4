<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
</head>

<body>

<h2>Edit User</h2>

<form th:action="@{/edit/{id}(id=${userForm.id})}"
      th:object="${userForm}"
      method="post">

    <label for="name">Name</label>
    <input type="text"
           id="name"
           th:field="*{name}">
    <br/>

    <label for="email">Email</label>
    <input type="text"
           id="email"
           th:field="*{email}">
    <br/>

    <label for="password">Password</label>
    <input type="password"
           id="password"
           th:field="*{password}">
    <br/>

    <input type="submit" value="Update User">

</form>

</body>
</html>
