<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<!-- 공통 Head 조각 불러오기 -->
<head th:replace="~{fragments/head :: commonHead('회원 정보 수정')}">
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar(${projects})}">
    </div>

    <!-- 메인 컨텐츠 영역 -->
    <div class="main-content">
        <div class="container">
            <!-- 폼 전용 CSS (Head 교체로 누락되는 것을 방지하기 위해 컨테이너 안에서 로드) -->
            <link rel="stylesheet" th:href="@{/css/signup.css}">

            <div class="header">
                <h1>회원 정보 수정</h1>
                <p>기존 회원의 접속 정보를 변경합니다.</p>
            </div>

            <div class="card">
                <!-- 컨트롤러에서 넘겨준 userForm 객체 사용 -->
                <form th:action="@{/edit-user/{id}(id=${userForm.id})}" th:object="${userForm}" method="post">

                    <!-- 수정 시 ID 유지를 위한 hidden 필드 -->
                    <input type="hidden" th:field="*{id}">

                    <fieldset>
                        <legend>접속 정보</legend>
                        <div class="form-group">
                            <label for="email">이메일</label>
                            <input type="email" id="email" th:field="*{email}">
                            <span class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        </div>
                        <div class="form-group">
                            <label for="password">비밀번호</label>
                            <input type="password" id="password" th:field="*{password}" placeholder="변경할 비밀번호 입력">
                            <span class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                        </div>
                    </fieldset>

                    <button type="submit" class="execute-button put-button">수정 완료</button>

                </form>

                <div class="back-link">
                    <a th:href="@{/user/list-users}">← 목록으로 돌아가기</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
