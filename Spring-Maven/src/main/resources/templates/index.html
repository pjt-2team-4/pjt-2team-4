<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{fragments/head :: commonHead('회원 관리 시스템 (대시보드)')}">
</head>

<body>

    <!-- 좌측 사이드바 -->
    <nav class="left-sidebar">
        <div class="sidebar-header">
            <h2>🏫 Spring Boot 관리자</h2>
        </div>
        <div class="sidebar-menu">
            <!-- 기본 메뉴 -->
            <a th:href="@{/}" class="nav-link active">홈 (대시보드)</a>
            <a th:href="@{/list-users}" class="nav-link">회원 전체 조회</a>
            <a th:href="@{/api-guide}" class="nav-link">API 가이드</a>
            <a th:href="@{/analysis}" class="nav-link">코드 보안 분석</a>

            <!-- 구분선 (막대) -->
            <hr class="sidebar-divider">

            <!-- 프로젝트 섹션 타이틀 -->
            <div class="sidebar-section-header">
                <span>내 프로젝트</span>
                <a th:href="@{/projects/new}" class="add-btn" title="새 프로젝트 생성">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </a>
            </div>

            <!-- 프로젝트 하위 메뉴 -->
            <div class="project-menu">
                <a th:href="@{/projects}" class="nav-link sub-link">📂 전체 프로젝트 관리</a>
                
                <!-- 💡 백엔드에서 Model에 'projects' 리스트를 담아줄 경우, 
                     아래 주석을 해제하여 사용자의 프로젝트 목록을 동적으로 출력할 수 있습니다. -->
                <!--
                <a th:each="project : ${projects}" 
                   th:href="@{/projects/{id}(id=${project.id})}" 
                   class="nav-link sub-link project-item">
                    <span class="project-dot"></span>
                    <span th:text="${project.name}">프로젝트 A</span>
                </a>
                -->
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <div class="main-content">
        <div class="container">
            <header class="header">
                <h1>대시보드</h1>
                <p>등록된 회원 데이터를 확인하고 관리합니다.</p>
            </header>
            
            <!-- 내용 -->
        </div>
    </div>

</body>
</html>
