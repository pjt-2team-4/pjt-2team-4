<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{fragments/head :: commonHead('코드 보안 분석')}"></head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar(${analyses})}"></div>

<div class="main-content">
    <div class="container">

        <header class="header">
            <h1>🛡️ 기존 파일 부분 재분석</h1>
            <p>서버에 이미 저장된 과거 분석 내역 중, 원하는 파일만 골라 새롭게 분석을 실행합니다.</p>
        </header>

        <section class="section">
            <h2 class="section-title">💻 분석 대상 선택</h2>

            <div class="card form-container">
                <form id="analyzeForm" onsubmit="executeAnalysis(event)">

                    <div class="input-group">
                        <label for="projectId">과거 분석 내역 (원본)</label>
                        <select id="projectId" name="projectId" required>
                            <option value="">원본 분석 내역을 선택하세요</option>
                            <option th:each="analysis : ${analyses}"
                                    th:value="${analysis.id}"
                                    th:text="${analysis.title}">
                            </option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="language">분석 언어 적용</label>
                        <select id="language" name="language" required>
                            <option value="JAVA" selected>Java</option>
                            <option value="PYTHON">Python</option>
                            <option value="JAVASCRIPT">JavaScript</option>
                            <option value="GO">Go</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <div class="file-tree-header">
                            <label>분석할 하위 파일 선택</label>
                            <div class="file-tree-actions">
                                <button type="button" class="action-btn" id="selectAllFilesBtn">전체 선택</button>
                                <button type="button" class="action-btn" id="unselectAllFilesBtn">전체 해제</button>
                            </div>
                        </div>
                        <div id="fileTree" class="file-tree">
                            <div class="file-tree-empty">분석 내역을 먼저 선택하세요.</div>
                        </div>
                        <div class="file-tree-footer">
                            선택된 파일: <span id="selectedFileCount">0</span>개
                        </div>
                    </div>

                    <button type="submit" class="execute-button post-button" id="analyzeBtn">
                        선택 파일로 새 분석 실행
                    </button>
                </form>
            </div>
        </section>

        <!-- 결과 표시 섹션 -->
        <section class="section" id="resultSection">
            <h2 class="section-title">📊 분석 결과</h2>
            <div class="card result-container">
                <div id="resultPlaceholder" class="result-placeholder">
                    재분석할 파일을 선택한 후 <strong>[선택 파일로 새 분석 실행]</strong> 버튼을 눌러주세요.
                </div>

                <div id="resultContent" style="display: none;">
                    <div class="result-summary">
                        <div class="summary-item">
                            <div class="summary-label">새 분석 ID</div>
                            <div class="summary-value" id="resId">-</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-label">총 발견 취약점</div>
                            <div class="summary-value" id="resTotal">0</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-label">HIGH 이상</div>
                            <div class="summary-value danger" id="resHigh">0</div>
                        </div>
                    </div>

                    <table class="vuln-table">
                        <thead>
                        <tr>
                            <th width="80">Line</th>
                            <th width="150">유형</th>
                            <th width="100">위험도</th>
                            <th>상세 내용</th>
                        </tr>
                        </thead>
                        <tbody id="vulnTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>
</div>

<!-- DB에서 파일 내용을 쓱 가져와서 새 분석으로 POST하는 JS (이전에 작성한 analysis-api.js 사용) -->
<script th:src="@{/js/analysis-api.js}"></script>

</body>
</html>
