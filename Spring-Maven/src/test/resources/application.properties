spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=http://localhost:3000

# Test-only values; no external LLM service or production JWT secret is required.
jwt.secret=01234567890123456789012345678901
llm.base-url=http://127.0.0.1:8000
llm.internal-token=test-only-token
llm.connect-timeout=5s
llm.read-timeout=75s
llm.phase-timeout=180s
llm.prompt-version=v1.0
llm.health-check.enabled=false
